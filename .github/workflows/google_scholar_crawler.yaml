name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"
      - "_config.yml"
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Fetch and validate the Google Scholar profile
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          python -m pip install -r google_scholar_crawler/requirements.txt
          python google_scholar_crawler/main.py
      - name: Publish citation data
        run: |
          output="$RUNNER_TEMP/citation-results"
          cp -r google_scholar_crawler/results "$output"
          branch=google-scholar-stats
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --depth=1 origin "refs/heads/$branch"
            git switch -c "$branch" FETCH_HEAD
          elif [ "$?" -eq 2 ]; then
            git switch --orphan "$branch"
          else
            exit 1
          fi
          cp "$output/gs_data.json" "$output/gs_data_shieldsio.json" .
          git add -- gs_data.json gs_data_shieldsio.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Google Scholar citation counts'
            git push origin "HEAD:refs/heads/$branch"
          fi
